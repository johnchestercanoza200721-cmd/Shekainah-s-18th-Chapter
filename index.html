<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ainah Cuaresma | The 18th Chapter</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Pinyon+Script&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

    <!-- PARALLAX BACKGROUND FLOWERS (Dynamically Generated) -->
    <div class="flower-layer"></div>

    <!-- ENVELOPE OVERLAY (CLICK TO OPEN) -->
    <div id="overlay" class="overlay" onclick="openInvite()">
        <div class="envelope-wrapper">
            <img src="images/envelope.png" class="env-img" alt="Envelope">
            <img src="images/waxseal.png" class="seal-img" alt="Wax seal - click to open">
        </div>
        <p class="click-text">CLICK TO UNSEAL</p>
    </div>

    <!-- MAIN INVITATION CONTENT -->
    <main class="content-wrapper">
        
        <!-- HERO SECTION: Header -->
        <section class="hero-section">
            <div class="hero-content">
                <img src="images/header1.png" class="main-header-img" alt="Ainah's 18th Chapter Header">
            </div>
        </section>

        <!-- Music Player -->
        <section class="music-player-section">
            <div class="spotify-player">
                <div class="player-container">
                    <!-- Album Art -->
                    <div class="album-art-container">
                        <img src="images/player.png" alt="Album Art" class="album-art">
                    </div>

                    <!-- Player Info and Controls -->
                    <div class="player-main">
                        <div class="track-info">
                            <div class="artist-name" id="artist-name">Olivia Dean</div>
                            <div class="song-title" id="song-title">A Couple Minutes</div>
                        </div>

                        <button class="control-btn play-btn" id="play-btn" aria-label="Play">
                            <svg class="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg class="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                            </svg>
                        </button>

                        <div class="progress-container">
                            <span class="time" id="current-time">0:00</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                                <input type="range" class="progress-slider" id="progress-slider" min="0" max="100" value="0">
                            </div>
                            <span class="time" id="duration-time">0:00</span>
                        </div>
                    </div>
                </div>
                <audio id="audio-player" preload="metadata">
                    <source src="images/music.mp3" type="audio/mpeg">
                </audio>
            </div>
        </section>

        <!-- Debutant List Sections -->
        <section class="png-section">
            <img src="images/debutantlist1.png" alt="Debutant List 1">
        </section>

        <section class="png-section">
            <img src="images/debutantlist2.png" alt="Debutant List 2">
        </section>

        <!-- Gift Note -->
        <section class="png-section">
            <img src="images/giftnote.png" alt="Gift Note">
        </section>

        <!-- Candles Note -->
        <section class="png-section">
            <img src="images/candlenotes.png" alt="Candles Note">
        </section>

        <!-- Blue Bills Gifts Note -->
        <section class="png-section">
            <img src="images/bluebillsgiftsnote.png" alt="Blue Bills Gifts Note">
        </section>

        <!-- Finest Details -->
        <section class="png-section">
            <img src="images/finestdetails.png" alt="Finest Details">
        </section>

         <!-- Venue Location -->
        <section class="venue-location-section">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d30756.19201411556!2d120.95961950273674!3d15.51001521086622!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3397291e959d1f3f%3A0x79f1aba16d95761e!2sD%26Y%20private%20resort!5e0!3m2!1sen!2sph!4v1771331682258!5m2!1sen!2sph" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>        </section>

        <!-- Dress Code -->
        <section class="png-section">
            <img src="images/dresscode1.png" alt="Dress Code">
        </section>

        <!-- Dress Code 2 -->
        <section class="png-section">
            <img src="images/dresscode2.png" alt="Dress Code 2">
        </section>

       

        <!-- RSVP Section -->
        <section class="png-section">
            <img src="images/rsvp.png" alt="RSVP">
        </section>

       <section class="rsvp-button-section">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScnRBGVOkcwiqJRYIr4EyKMMV9xNMEep5OnWxcg2-WpRZxNsg/viewform" 
       class="rsvp-button" 
       id="rsvp-form-link" 
       target="_blank">respond</a>
</section>

        <!-- End Card -->
        <section class="png-section">
            <img src="images/endcard1.png" alt="End Card1">
        </section>

            <section class="png-section">
            <img src="images/endcard2.png" alt="End Card2">
        </section>

            <section class="png-section">
            <img src="images/endcard3.png" alt="End Card3">
        </section>
        
        <section class="png-section">
            <img src="images/endcard4.png" alt="End Card4">
        </section>

        <section class="png-section">
            <img src="images/endcard5.png" alt="End Card5">
        </section>

        <section class="png-section">
            <img src="images/endcard6.png" alt="End Card6">
        </section>
<section class="png-section">
    <img src="images/endcard7.png" alt="End Card7">
</section>

<section class="png-section">
    <img src="images/endcard8.png" alt="End Card8">
</section>

<section class="png-section">
    <img src="images/endcard9.png" alt="End Card9">
</section>

<section class="png-section">
    <img src="images/endcard10.png" alt="End Card10">
</section>

<section class="png-section">
    <img src="images/endcard11.png" alt="End Card11">
</section>

<section class="png-section">
    <img src="images/endcard12.png" alt="End Card12">
</section>

 <!-- Timeline -->
        <section class="png-section">
            <img src="images/timeline.png" alt="Timeline">
        </section>

    </main>

    <!-- PARALLAX FOREGROUND FLOWERS (Dynamically Generated) -->
    <div class="foreground-flowers"></div>

    <script src="script.js"></script>
</body>
</html>
