<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ainah Cuaresma | The 18th Chapter</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Pinyon+Script&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="locked">

    <!-- PARALLAX BACKGROUND FLOWERS (Dynamically Generated) -->
    <div class="flower-layer"></div>

    <!-- ENVELOPE OVERLAY (CLICK TO OPEN) -->
    <div id="overlay" class="overlay" onclick="openInvite()">
        <div class="envelope-wrapper">
            <img src="images/envelope.png" class="env-img" alt="Envelope">
            <img src="images/waxseal.png" class="seal-img" alt="Wax seal - click to open">
        </div>
        <p class="click-text">CLICK TO UNSEAL</p>
    </div>

    <!-- MAIN INVITATION CONTENT -->
    <main class="content-wrapper">
        
        <!-- HERO SECTION: Header -->
        <section class="hero-section">
            <div class="hero-content">
                <img src="images/Header1.png" class="main-header-img" alt="Ainah's 18th Chapter Header">
            </div>
        </section>

        <!-- Music Player -->
        <section class="music-player-section">
            <div class="spotify-player">
                <div class="player-container">
                    <!-- Album Art -->
                    <div class="album-art-container">
                        <img src="images/Player.png" alt="Album Art" class="album-art">
                    </div>

                    <!-- Player Info and Controls -->
                    <div class="player-main">
                        <div class="track-info">
                            <div class="artist-name" id="artist-name">Olivia Dean</div>
                            <div class="song-title" id="song-title">A Couple Minutes</div>
                        </div>

                        <button class="control-btn play-btn" id="play-btn" aria-label="Play">
                            <svg class="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg class="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
                            </svg>
                        </button>

                        <div class="progress-container">
                            <span class="time" id="current-time">0:00</span>
                            <div class="progress-bar">
                                <div class="progress-fill" id="progress-fill"></div>
                                <input type="range" class="progress-slider" id="progress-slider" min="0" max="100" value="0">
                            </div>
                            <span class="time" id="duration-time">0:00</span>
                        </div>
                    </div>
                </div>
                <audio id="audio-player" preload="metadata">
                    <source src="images/Olivia Dean - A Couple Minutes (Lyric Video)(1).mp3" type="audio/mpeg">
                </audio>
            </div>
        </section>

        <!-- Debutant List Sections -->
        <section class="png-section">
            <img src="images/Debutantlist1.png" alt="Debutant List 1">
        </section>

        <section class="png-section">
            <img src="images/Debutantlist2.png" alt="Debutant List 2">
        </section>

        <!-- Gift Note -->
        <section class="png-section">
            <img src="images/Giftnote.png" alt="Gift Note">
        </section>

        <!-- Candles Note -->
        <section class="png-section">
            <img src="images/Candlesnote.png" alt="Candles Note">
        </section>

        <!-- Blue Bills Gifts Note -->
        <section class="png-section">
            <img src="images/BluebillsGiftsnote.png" alt="Blue Bills Gifts Note">
        </section>

        <!-- Finest Details -->
        <section class="png-section">
            <img src="images/FinestDetails.png" alt="Finest Details">
        </section>

        <!-- Dress Code -->
        <section class="png-section">
            <img src="images/Dresscode.png" alt="Dress Code">
        </section>

        <!-- Dress Code 2 -->
        <section class="png-section">
            <img src="images/Dresscode2.png" alt="Dress Code 2">
        </section>

        <!-- Venue Location -->
        <section class="venue-location-section">
            <!-- Map embed and location details will be added here -->
        </section>

        <!-- Timeline -->
        <section class="png-section">
            <img src="images/Timeline.png" alt="Timeline">
        </section>

        <!-- RSVP Section -->
        <section class="png-section">
            <img src="images/RSVP.png" alt="RSVP">
        </section>

        <!-- RSVP Button -->
        <section class="rsvp-button-section">
            <a href="#" class="rsvp-button" id="rsvp-form-link">RSVP Now</a>
        </section>

        <!-- End Card -->
        <section class="png-section">
            <img src="images/Endcard.png" alt="End Card">
        </section>
        
    </main>

    <!-- PARALLAX FOREGROUND FLOWERS (Dynamically Generated) -->
    <div class="foreground-flowers"></div>

    <script src="script.js"></script>
</body>
</html>
